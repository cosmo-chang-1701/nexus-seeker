name: Nexus Seeker CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_call:

jobs:
  test-and-lint:
    name: 🧹 Test and Lint
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: 🐍 Set up Python 3.12
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: "3.12"

    - name: 🧹 Run Pre-commit Hooks (Ruff, Format, Mypy Core & Scraper)
      uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      with:
        extra_args: --all-files

    - name: 🕷️ Run Nexus Edge Scraper Unit Tests
      run: |
        pip install ./nexus_edge_scraper pytest pytest-asyncio
        pytest nexus_edge_scraper/tests -v

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

    - name: 🧪 Run Nexus Core Containerized Tests (Pytest)
      run: |
        cd nexus_core
        cp .env.example .env
        docker compose run --rm nexus-seeker python -m pytest tests -p no:cacheprovider

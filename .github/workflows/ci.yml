name: Nexus Seeker CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_call:

jobs:
  test-and-lint:
    name: 🧹 Test and Lint
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: 🧹 Run Pre-commit Hooks (Ruff, Format, Mypy Core & Scraper)
      uses: pre-commit/action@v3.0.1
      with:
        extra_args: --all-files

    - name: 🕷️ Run Nexus Edge Scraper Unit Tests
      run: |
        pip install ./nexus_edge_scraper pytest pytest-asyncio
        pytest nexus_edge_scraper/tests -v

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🧪 Run Nexus Core Containerized Tests (Pytest)
      run: |
        cd nexus_core
        cp .env.example .env
        docker compose run --rm nexus-seeker python -m pytest tests -p no:cacheprovider

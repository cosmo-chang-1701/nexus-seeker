repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: debug-statements
      - id: check-ast
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        name: mypy-core
        args: [--config-file=nexus_core/pyproject.toml, --explicit-package-bases]
        additional_dependencies: [
          pydantic>=2.14.1,
          types-requests,
          types-psutil,
          click>=8.5.0,
          rich>=15.0.0,
          discord.py>=2.7.0
        ]
        files: ^nexus_core/
      - id: mypy
        name: mypy-edge-scraper
        args: [--config-file=nexus_edge_scraper/pyproject.toml, --explicit-package-bases]
        additional_dependencies: [
          pydantic>=2.14.1,
          rich>=15.0.0,
          attrs>=23.1.0,
          fastapi>=0.162.0,
          types-requests,
          types-psutil,
          types-beautifulsoup4,
          httpx>=0.28.0,
        ]
        files: ^nexus_edge_scraper/

  - repo: https://github.com/returntocorp/semgrep
    rev: 'v1.182.0'
    hooks:
      - id: semgrep
        args: ['--config', auto, '--error']
        stages: [pre-push]

  - repo: local
    hooks:
      - id: core-test
        name: core-test
        entry: bash scripts/docker_test.sh
        language: system
        stages: [pre-push]
        always_run: false
        files: ^nexus_core/(.*\.py|pyproject\.toml)$
        pass_filenames: false

      # edge 全量 Mypy（Docker 內含完整依賴：playwright / pandas / yfinance / pytest 等
      # 在 pre-commit 的 mypy-edge-scraper 環境中並未安裝，只能以 ignore_missing_imports 當 Any）。
      - id: edge-mypy
        name: edge-mypy
        entry: bash scripts/docker_edge_mypy.sh
        language: system
        stages: [pre-push]
        always_run: false
        files: ^nexus_edge_scraper/
        pass_filenames: false

      - id: scraper-test
        name: scraper-test
        entry: bash -c "PYTHONPATH=nexus_edge_scraper nexus_core/.venv/bin/pytest nexus_edge_scraper/tests"
        language: system
        stages: [pre-push]
        always_run: false
        files: ^nexus_edge_scraper/.*\.py$
        pass_filenames: false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-seeker"
version = "1.13.38"

description = "Nexus Seeker Quantitative Discord Bot and Market Analysis"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.3.0",
    "yfinance>=0.2.31",
    "pandas>=2.0.0",
    "pandas-ta>=0.3.14",
    "py_vollib>=1.0.1",
    "pandas_market_calendars>=4.3.1",
    "python-dotenv>=1.0.0",
    "tzdata>=2023.3",
    "numpy>=1.24.0",
    "pydantic>=2.12.5",
    "openai>=2.21.0",
    "httpx",
    "finnhub-python>=2.4.20",
    "aiolimiter>=1.1.0",
    "websockets>=12.0",
    "psutil>=5.9.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["calibration*", "cogs*", "database*", "market_analysis*", "models*", "services*", "ui*", "tests*"]

[tool.setuptools]
py-modules = ["bot", "bot_healthy", "cli", "config", "main", "market_math", "market_time"]

[tool.mypy]
python_version = "3.12"
cache_dir = "/tmp/.mypy_cache"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = false
explicit_package_bases = true
mypy_path = ".:nexus_core"
no_implicit_optional = true
exclude = ["build", "dist"]

[[tool.mypy.overrides]]
module = [
    "yfinance",
    "pandas_ta.*",
    "py_vollib.*",
    "pandas_market_calendars.*",
    "finnhub.*",
    "aiolimiter.*",
    "pandas.*",
    "websockets.*",
    "numpy.*",
    "openai.*",
    "discord.*",
    "dotenv.*",
    "psutil.*",
    "pytest",
    "httpx"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# --strict-markers：拼錯的 marker 直接報錯，而不是讓測試無聲地溜出 `-m` 篩選。
addopts = "--strict-markers"
markers = [
    "slow: 單檔累計約 3 秒以上或單一測試 1 秒以上；pre-push 快速子集會排除，CI 全量仍會執行",
    "integration: tests/integration/ 下的測試（由 tests/conftest.py 自動標記）；pre-push 快速子集會排除",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

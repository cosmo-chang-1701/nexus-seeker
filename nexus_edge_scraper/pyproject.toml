[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-edge-scraper"
version = "0.1.0"
description = "Nexus Seeker Edge Scraper Service"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "playwright",
    "beautifulsoup4",
    "lxml",
    "playwright-stealth",
    "openpyxl",
    "requests",
    "httpx",
    "psutil",
    "pandas",
    "yfinance",
    "scikit-learn>=1.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
]

[tool.setuptools]
py-modules = ["section_extractor", "yf_api"]

[tool.setuptools.packages.find]
where = ["."]
include = ["local_api*"]

[tool.mypy]
python_version = "3.12"
cache_dir = "/tmp/.mypy_cache"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = false
explicit_package_bases = true
mypy_path = ".:nexus_edge_scraper"
no_implicit_optional = true
exclude = ["build", "dist", ".venv"]

[[tool.mypy.overrides]]
module = [
    "playwright.*",
    "playwright_stealth.*",
    "bs4.*",
    "lxml.*",
    "openpyxl.*",
    "yfinance.*",
    "requests.*",
    "pytest.*",
    "pandas.*",
    "fastapi.*",
    "psutil.*",
]
ignore_missing_imports = true



[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
